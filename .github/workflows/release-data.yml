name: Release data
run-name: Release data

# Rebuilds the corpus and publishes a dated data release: the site archive, the
# parsed corpus, the offline MCP bundle, and the server image. Release notes are
# the version diff against the previous snapshot.
#
# Tags: data-YYYY-MM-DD here, site-YYYY-MM-DD for a rebuild of the site alone,
# v* for code. The corpus published here is what a site release builds from.

on:
  # monthly, plus a button. The corpus changes slowly: two modules moved in a day.
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:
    inputs:
      publish:
        description: create the release (off = build and check only)
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

# two runs must not pick the same tag between viewing it and creating it
concurrency:
  group: release-data
  cancel-in-progress: false

env:
  DATA_BRANCH: data

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site plugin
        run: |
          corepack enable
          yarn install --immutable || yarn install
          yarn build

      - name: Take the accumulated data
        run: |
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git checkout FETCH_HEAD -- snapshots blog
            echo "snapshots: $(ls snapshots/*.json 2>/dev/null | wc -l), entries: $(ls blog/*.podlite 2>/dev/null | wc -l)"
          else
            echo "no data branch yet — starting from what the repository carries"
          fi

      - uses: ./.github/actions/collect-corpus

      - name: Snapshot module versions
        id: snapshot
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          node ./bin/snapshot-registry.mjs

      - name: Write the ecosystem digest for the blog
        run: |
          COUNT=$(ls snapshots/*.json | wc -l)
          if [ "$COUNT" -ge 2 ]; then
            node ./bin/diff-snapshots.mjs --blog "blog/${{ steps.snapshot.outputs.date }}-ecosystem.podlite"
          else
            echo "one snapshot only — nothing to compare yet"
          fi

      - uses: ./.github/actions/build-site

      - name: Pack the artefacts
        run: |
          node ./bin/build-kb-index.mjs out mcp-server/kb-index.json
          mkdir -p /tmp/stage/raku-kb-mcp
          rsync -a --exclude node_modules --exclude package-lock.json mcp-server/ /tmp/stage/raku-kb-mcp/
          tar czf raku-kb-mcp-offline.tar.gz -C /tmp/stage raku-kb-mcp
          ls -lh index.zip raku-kb-mcp-offline.tar.gz

      - name: Pack the corpus a site release builds from
        run: |
          node ./bin/corpus-manifest.mjs --image podlite/podlite-web:0.10.17
          # the pods go with the trees: without them the index of terms loses
          # entries, and they weigh a fraction of what the trees do
          # one NUL-separated list and nothing else on the command line: a name may
          # hold a newline, and BSD tar reads --null -T only when no operand precedes it
          {
            printf '%s\0' corpus-manifest.json \
              built/mods-tree.json built/ecosystem.json built/mods.json \
              built/docs-tree.json built/examples-tree.json
            find work_mods \( -name '*.pod6' -o -name '*.podlite' \) -print0
          } > /tmp/corpus-files
          tar czf corpus.tar.gz --null -T /tmp/corpus-files
          ls -lh corpus.tar.gz

      - name: Write release notes from the version diff
        run: |
          COUNT=$(ls snapshots/*.json | wc -l)
          if [ "$COUNT" -ge 2 ]; then
            node ./bin/diff-snapshots.mjs > /tmp/notes.md
          else
            echo "First data release — nothing to compare against yet." > /tmp/notes.md
          fi
          {
            echo
            echo '**Install the offline bundle**'
            echo
            echo '```sh'
            echo 'tar xzf raku-kb-mcp-offline.tar.gz && cd raku-kb-mcp'
            echo 'npm install'
            echo 'claude mcp add raku-kb -- node "$PWD/bin/raku-kb-mcp.mjs"'
            echo '```'
            echo
            echo 'The bundle and the image hold the site as it stood on this date.'
            echo 'A later site release may have moved the pages on without them.'
            echo
            echo 'Or run the server image directly:'
            echo
            echo '```sh'
            echo "docker run -i --rm ghcr.io/${GITHUB_REPOSITORY_OWNER}/raku-kb-mcp:latest"
            echo '```'
          } >> /tmp/notes.md
          cat /tmp/notes.md

      - name: Publish the server image
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr 'A-Z' 'a-z')
          IMAGE="ghcr.io/${OWNER}/raku-kb-mcp"
          docker build -t "$IMAGE:${{ steps.snapshot.outputs.date }}" -t "$IMAGE:latest" mcp-server
          docker push "$IMAGE:${{ steps.snapshot.outputs.date }}"
          docker push "$IMAGE:latest"

      - name: Create the release
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # a second run on the same day must not collide with the morning tag
          TAG="data-${{ steps.snapshot.outputs.date }}"
          N=2
          while gh release view "$TAG" >/dev/null 2>&1; do
            TAG="data-${{ steps.snapshot.outputs.date }}.$N"
            N=$((N + 1))
          done
          gh release create "$TAG" \
            index.zip raku-kb-mcp-offline.tar.gz corpus.tar.gz \
            --title "Raku KB — ${{ steps.snapshot.outputs.date }}" \
            --notes-file /tmp/notes.md


      - name: Keep the data on its own branch
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          # main is locked, so version snapshots and blog entries accumulate on a
          # branch of their own; every run reads it back before building the site
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # commit on top of the branch itself, in a worktree of its own, so its
          # history survives and the build checkout stays untouched
          WT=/tmp/data-branch
          rm -rf "$WT"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git worktree add --detach "$WT" FETCH_HEAD
          else
            git worktree add --detach "$WT" HEAD
          fi
          mkdir -p "$WT/snapshots" "$WT/blog"
          mkdir -p "$WT/snapshots/corpus"
          cp -f snapshots/*.json "$WT/snapshots/" 2>/dev/null || true
          cp -f snapshots/corpus/*.json "$WT/snapshots/corpus/" 2>/dev/null || true
          cp -f blog/*.podlite "$WT/blog/" 2>/dev/null || true
          cd "$WT"
          git add snapshots blog
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "data: module versions and ecosystem digest as of ${{ steps.snapshot.outputs.date }}"
          git push origin "HEAD:refs/heads/$DATA_BRANCH"
