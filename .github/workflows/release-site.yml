name: Release site
run-name: Release site

# The site without the data. It takes the parsed corpus from the newest data
# release instead of collecting it again, so what comes out carries the change
# that was made and nothing else. Tags: site-YYYY-MM-DD.
#
# Runs on a push of a blog entry to the data branch, and on the button for any
# other change to the site itself.

on:
  workflow_call:
    inputs:
      ref:
        description: what to build the site from
        type: string
        default: main
  push:
    branches: [data]
    paths: ['blog/**']
  workflow_dispatch:
    inputs:
      publish:
        description: create the release (off = build and check only)
        type: boolean
        default: true

permissions:
  contents: write

# two runs must not pick the same tag between viewing it and creating it
concurrency:
  group: release-site
  cancel-in-progress: false

env:
  DATA_BRANCH: data

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site plugin
        run: |
          corepack enable
          yarn install --immutable || yarn install
          yarn build

      - name: Take the entries from the data branch
        run: |
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            # only blog: the site reads no snapshots, and asking for a path the
            # branch does not carry fails the whole step
            git checkout FETCH_HEAD -- blog || echo "no entries on the branch yet"
          else
            echo "no data branch yet — starting from what the repository carries"
          fi
          echo "entries: $(ls blog/*.podlite 2>/dev/null | wc -l)"

      - name: Take the corpus from the newest data release that carries one
        id: corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the list of releases carries the assets, so this is one call and not
          # one per release. A draft has nothing to download and a prerelease is
          # not the corpus anyone should be building against.
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name|startswith("data-"))
                    | select(.draft|not) | select(.prerelease|not)
                    | select(any(.assets[]?; .name=="corpus.tar.gz"))][0].tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "no data release carries a corpus"
            echo "have=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$TAG" -p corpus.tar.gz
          tar xzf corpus.tar.gz
          rm -f corpus.tar.gz
          echo "have=yes" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "corpus from $TAG"

      - name: Check the corpus against its manifest
        if: steps.corpus.outputs.have == 'yes'
        run: node ./bin/corpus-manifest.mjs --check

      # No release carries a corpus yet, so this run parses one for itself. It
      # holds the ecosystem as it stands now, not only the change that started
      # the run, and it goes nowhere: no release of it, no branch, no asset.
      - name: Parse a corpus for this build alone
        if: steps.corpus.outputs.have != 'yes'
        uses: ./.github/actions/collect-corpus

      - uses: ./.github/actions/build-site

      - name: Create the release
        # inputs.publish exists only for the button: on a push and on a call from
        # another workflow it is empty, and an empty value equals false here
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # a second run on the same day must not collide with the morning tag
          DATE=$(date -u +%Y-%m-%d)
          TAG="site-$DATE"
          N=2
          while gh release view "$TAG" >/dev/null 2>&1; do
            TAG="site-$DATE.$N"
            N=$((N + 1))
          done
          {
            echo "The site, rebuilt from the sources as they are now."
            echo
            if [ "${{ steps.corpus.outputs.have }}" = "yes" ]; then
              echo "No new ecosystem reading: the corpus is the one published with"
              echo "\`${{ steps.corpus.outputs.tag }}\`."
            else
              echo "No data release carries a corpus yet, so this build parsed one of"
              echo "its own. It holds the ecosystem as of today and is published nowhere."
            fi
            echo
            echo "The offline bundle and the server image live in the data release"
            echo "and are not republished here."
          } > /tmp/notes.md
          gh release create "$TAG" index.zip \
            --title "Raku KB site — $DATE" \
            --notes-file /tmp/notes.md
