name: Release code
run-name: Release code

# The counterpart of release-data.yml. Tags: data-YYYY-MM-DD for the corpus,
# site-YYYY-MM-DD for the site alone, v* for code. This one makes the code
# release, writes the same changes as an entry on the site, and then has the
# site rebuilt so a reader sees them.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: tag to release from
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Read the tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: The manifest version must equal the tag
        run: |
          MANIFEST=$(node -p "require('./package.json').version")
          if [ "$MANIFEST" != "${{ steps.tag.outputs.version }}" ]; then
            echo "package.json says $MANIFEST, the tag says ${{ steps.tag.outputs.version }}"
            exit 1
          fi
          echo "version and tag agree: $MANIFEST"

      - name: Write the release notes from the changelog
        run: |
          {
            echo "## What's Changed"
            echo
            node scripts/extract-changelog.mjs --summary
            echo
            PREV=$(git tag --list 'v*' --sort=-creatordate | grep -Fxv "${{ steps.tag.outputs.tag }}" | head -1)
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${{ steps.tag.outputs.tag }}"
            fi
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          case "${{ steps.tag.outputs.tag }}" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file /tmp/notes.md \
            --target "${{ github.sha }}" \
            $PRERELEASE

      - name: Put the same changes on the site as an entry
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p blog
          node scripts/extract-changelog.mjs --entry "blog/$DATE-release-${{ steps.tag.outputs.version }}.podlite"

      - name: Keep the entry on the data branch
        run: |
          # main is locked, so entries live on a branch of their own; the site
          # release below reads them back from there
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          WT=/tmp/data-branch
          rm -rf "$WT"
          git fetch --depth=1 origin data
          git worktree add --detach "$WT" FETCH_HEAD
          mkdir -p "$WT/blog"
          cp -f blog/*.podlite "$WT/blog/"
          cd "$WT"
          git add blog
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "data: the changes of ${{ steps.tag.outputs.tag }} as an entry"
          git push origin "HEAD:refs/heads/data"

  # a push by github-actions[bot] starts no workflow, so the site release is
  # called here rather than left to the trigger on the data branch
  site:
    needs: release
    uses: ./.github/workflows/release-site.yml
    permissions:
      contents: write
